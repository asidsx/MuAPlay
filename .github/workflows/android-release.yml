name: Build Android APK Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web App & Add/Sync Capacitor Android
        run: |
          npm run build
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Native Android Service & MediaSession
        run: python3 scripts/prepare_android.py

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign Release APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          
          # 1. Генерация ключа подписи
          keytool -genkey -v -keystore release.keystore \
            -alias muaplay_alias -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass muaplaysimplepass -keypass muaplaysimplepass \
            -dname "CN=MuAPlay, OU=App, O=MuAPlay, L=City, S=State, C=US"
          
          # 2. Выравнивание (zipalign)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk
          
          # 3. Подпись APK через apksigner
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore \
            --ks-key-alias muaplay_alias \
            --ks-pass pass:muaplaysimplepass \
            --key-pass pass:muaplaysimplepass \
            --out android/app/build/outputs/apk/release/MuAPlay-v1.0-release.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

      - name: Upload Signed APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/MuAPlay-v1.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
