name: Build Android APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web App & Sync Capacitor Android
        run: |
          npm run build
          if [ ! -f "android/gradlew" ] || [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Android platform not found. Initializing Capacitor Android..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Native Android Service & MediaSession
        run: python3 scripts/prepare_android.py

      - name: Build Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Pandroid.injected.testOnly=false
          cd ..

      - name: Sign Release APK with uber-apk-signer (v1 + v2 + v3 + v4 Schemes)
        run: |
          # 1. Определение динамического имени APK под версию релиза
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="latest"
          fi
          APK_NAME="MuAPlay-${RELEASE_TAG}.apk"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          
          curl -L -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          mkdir -p release-apks
          
          # Locate strictly the Release APK output
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          fi
          echo "Targeting Release APK for signing: $RELEASE_APK"
          
          java -jar uber-apk-signer.jar -a "$RELEASE_APK" --out release-apks --allowResign --verbose
          
          cd release-apks
          SIGNED_FILE=$(find . -maxdepth 1 -name "*-aligned-signed.apk" | head -n 1)
          if [ -z "$SIGNED_FILE" ]; then
            SIGNED_FILE=$(find . -maxdepth 1 -name "*.apk" | head -n 1)
          fi
          
          echo "Final Signed Release APK: $SIGNED_FILE"
          
          # Переименовываем в наше целевое имя
          cp -f "$SIGNED_FILE" "$APK_NAME"
          echo "OUT_APK=release-apks/$APK_NAME" >> $GITHUB_ENV
          ls -lh

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.OUT_APK }}

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ env.OUT_APK }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'MuAPlay Latest Release' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
