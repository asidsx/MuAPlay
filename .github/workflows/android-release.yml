name: Build Android APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web App & Sync Capacitor Android
        run: |
          npm run build
          if [ ! -f "android/gradlew" ] || [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Android platform not found. Initializing Capacitor Android..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Native Android Service & MediaSession
        run: python3 scripts/prepare_android.py

      - name: Build Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..

      - name: Align and Sign Release APK (v1, v2, v3)
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          
          # 1. Определение динамического имени APK под версию релиза
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="latest"
          fi
          APK_NAME="MuAPlay-${RELEASE_TAG}.apk"
          OUT_APK="android/app/build/outputs/apk/release/${APK_NAME}"
          echo "Target APK Name: $APK_NAME"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "OUT_APK=$OUT_APK" >> $GITHUB_ENV
          
          # 2. Создание надежного Release Keystore через keytool (JDK 21)
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias muaplay_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass muaplaysimplepass \
            -keypass muaplaysimplepass \
            -dname "CN=MuAPlay, OU=Audio, O=MuAPlay, L=City, ST=State, C=US"
          
          # 3. Поиск собранного APK
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found build APK: $RAW_APK"
          
          # 4. Выравнивание 4-byte (zipalign)
          $BUILD_TOOLS_DIR/zipalign -v -p -f 4 "$RAW_APK" android/app/build/outputs/apk/release/app-aligned.apk
          
          # 5. Подпись APK с целевым динамическим именем
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks \
            --ks-key-alias muaplay_alias \
            --ks-pass pass:muaplaysimplepass \
            --key-pass pass:muaplaysimplepass \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT_APK" \
            android/app/build/outputs/apk/release/app-aligned.apk
          
          # 6. Валидация подписи
          $BUILD_TOOLS_DIR/apksigner verify --verbose "$OUT_APK"

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.OUT_APK }}

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ env.OUT_APK }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'MuAPlay Latest Release' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
