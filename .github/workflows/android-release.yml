name: Build Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web App & Add/Sync Capacitor Android
        run: |
          npm run build
          if [ ! -f "android/gradlew" ] || [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Android gradle wrapper not found. Generating fresh Android platform with Capacitor..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Native Android Service & MediaSession
        run: python3 scripts/prepare_android.py

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign Release APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          
          # 1. Восстановление фиксированного сертификата подписи (PKCS12)
          echo "" | base64 -d > release.p12
          
          # 2. Выравнивание (zipalign)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk
          
          # 3. Подпись APK через apksigner с использованием постоянного ключа
          $BUILD_TOOLS_DIR/apksigner sign --ks release.p12 \
            --ks-key-alias muaplay_alias \
            --ks-pass pass:muaplaysimplepass \
            --key-pass pass:muaplaysimplepass \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out android/app/build/outputs/apk/release/MuAPlay.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuAPlay-Release-APK
          path: android/app/build/outputs/apk/release/MuAPlay.apk

      - name: Upload Signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/MuAPlay.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
